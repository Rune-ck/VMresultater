<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM 2026 – Tippekonkurranse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #ffffff;
    --bg2:     #FCFAEE;
    --bg3:     #eeedea;
    --text:    #1a1a18;
    --text2:   #5f5e5a;
    --text3:   #888780;
    --border:  rgba(0,0,0,.10);
    --border2: rgba(0,0,0,.20);
    --radius:  10px;
    --rsm:     6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1a1a18;
      --bg2:     #242422;
      --bg3:     #2e2e2b;
      --text:    #e8e6df;
      --text2:   #9c9a92;
      --text3:   #6b6963;
      --border:  rgba(255,255,255,.10);
      --border2: rgba(255,255,255,.20);
    }
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .page { max-width: 1100px; margin: 0 auto; }

  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text3); margin-bottom: 16px; }

  /* ── HOVED-LAYOUT: liste til venstre, graf til høyre ── */
  .main-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 12px;
    align-items: start;
  }
  @media (max-width: 700px) {
    .main-layout { grid-template-columns: 1fr; }
  }

  /* ── KORT (enkeltkolonne-liste) ── */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card.card-skjult { display: none !important; }
  .cards.ekspandert .card.card-skjult { display: grid !important; }
  .ekspander-btn {
    width: 100%;
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-size: 12px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    margin-top: 2px;
    transition: background .12s;
  }
  .ekspander-btn:hover { background: var(--bg2); }
  .card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    position: relative;
    cursor: default;
    display: grid;
    grid-template-columns: 24px 1fr auto;
    grid-template-rows: auto auto auto;
    column-gap: 8px;
    align-items: center;
  }
  .card-rank  {
    font-size: 11px; color: var(--text3);
    grid-column: 1; grid-row: 1;
    text-align: center;
  }
  .card-name  {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    grid-column: 2; grid-row: 1;
  }
  .card-pts   {
    font-size: 16px; font-weight: 500;
    grid-column: 3; grid-row: 1;
    text-align: right;
    white-space: nowrap;
  }
  .card-pts span { font-size: 12px; font-weight: 400; color: var(--text3); }
  .card-max   { display: none; }
  .card-bar   {
    height: 2px; background: var(--bg3); border-radius: 2px;
    margin-top: 5px; overflow: hidden;
    grid-column: 2 / 4; grid-row: 2;
  }
  .card-bar-fill { height: 100%; border-radius: 2px; }
  .medal {
    position: static;
    font-size: 13px;
    grid-column: 1; grid-row: 1;
    text-align: center;
  }

  /* Kategori-badges */
  .card-cats {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
    grid-column: 2 / 4; grid-row: 3;
  }
  .cat-badge {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg2);
    border-radius: 3px;
    padding: 1px 4px;
    white-space: nowrap;
  }

  /* ── KORT-TOOLTIP ── */
  .card-tooltip {
    display: none;
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px 14px;
    min-width: 200px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    pointer-events: none;
  }
  .card:hover .card-tooltip { display: block; }
  /* Flip to left if near right edge */
  .cards .card-tooltip { left: calc(100% + 10px); }
  .card-tooltip-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-tooltip-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .card-tooltip-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 3px 0;
    color: var(--text2);
  }
  .card-tooltip-row:last-child {
    border-top: 0.5px solid var(--border);
    margin-top: 4px;
    padding-top: 6px;
    color: var(--text);
    font-weight: 500;
  }
  .card-tooltip-val { font-weight: 500; color: var(--text); }
  .card { position: relative; overflow: visible; }

  /* ── GRAF ── */
  .chart-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
    margin-bottom: 0;
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chart-title { font-size: 14px; font-weight: 500; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    padding: 3px 7px;
    border-radius: var(--rsm);
    transition: background .12s, opacity .12s;
    user-select: none;
  }
  .legend-item:hover { background: var(--bg2); }
  .legend-item.muted { opacity: .3; }
  .legend-dot { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .chart-wrap { position: relative; width: 100%; height: 480px; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    pointer-events: auto;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text);
    min-width: 190px;
    max-width: 230px;
    max-height: 80vh;
    display: none;
    flex-direction: column;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    overflow: hidden;
  }
  #tooltip.visible { display: flex; }
  .tt-date {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
    font-weight: 500;
    padding-bottom: 5px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  #tt-rows {
    overflow-y: auto;
    flex: 1;
    max-height: 60vh;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  .tt-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .tt-row:last-child { border-bottom: none; }
  .tt-left  { display: flex; align-items: flex-start; gap: 5px; flex: 1; min-width: 0; }
  .tt-dot   { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .tt-info  { flex: 1; min-width: 0; }
  .tt-name  { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tt-cats  { display: flex; gap: 5px; margin-top: 2px; flex-wrap: wrap; }
  .tt-cat   { font-size: 10px; color: var(--text3); }
  .tt-cat span { color: var(--text2); }
  .tt-right { text-align: right; flex-shrink: 0; }
  .tt-pts   { font-weight: 500; }
  .tt-delta { font-size: 10px; color: var(--text3); }

  .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text3);
    flex-wrap: wrap;
    gap: 4px;
  }

  /* ── DETALJMODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 12px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text3);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--rsm);
  }
  .modal-close:hover { background: var(--bg2); color: var(--text); }
  .modal-body {
    overflow-y: auto;
    padding: 16px 18px;
    flex: 1;
  }
  .modal-loading {
    text-align: center;
    color: var(--text3);
    padding: 40px 0;
    font-size: 13px;
  }
  .modal-section {
    margin-bottom: 20px;
  }
  .modal-section-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-section-sum {
    font-size: 12px;
    color: var(--text2);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }
  .modal-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 12px;
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row-left { color: var(--text2); flex: 1; min-width: 0; }
  .modal-row-kamp { color: var(--text); font-weight: 400; }
  .modal-row-merknad { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .modal-row-right { flex-shrink: 0; text-align: right; }
  .modal-row-poeng { font-weight: 500; }
  .modal-row-poeng.grønn { color: #1a7f50; }
  .modal-row-poeng.graa  { color: var(--text3); }
  .modal-totalt {
    display: flex;
    justify-content: space-between;
    padding: 12px 0 0;
    border-top: 1.5px solid var(--border2);
    font-size: 14px;
    font-weight: 500;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="page">

  <h1>⚽ VM 2026 – Tippekonkurranse</h1>
  <p class="subtitle" id="subtitle">Laster data…</p>

  <div id="tooltip">
    <div class="tt-date" id="tt-date"></div>
    <div id="tt-rows"></div>
  </div>

  <div class="main-layout">
    <div id="cards" class="cards"></div>

    <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Kumulative poeng</span>
      <div class="legend" id="legend"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"
        role="img"
        aria-label="Linjegraf med kumulative poeng per deltaker gjennom VM 2026">
      </canvas>
    </div>
    </div>
  </div><!-- /main-layout -->

  <div class="footer">
    <span id="updated"></span>
    <span>Maks 391 poeng totalt</span>
  </div>

</div>

<!-- DETALJMODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="lukkModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <div class="modal-dot" id="modalDot"></div>
        <span id="modalNavn"></span>
      </div>
      <button class="modal-close" onclick="lukkModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-loading">Laster…</div>
    </div>
  </div>
</div>
<script>
// ─── KONFIG ───────────────────────────────────────────────────────
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyWAAZl5obPRHd6XIJHbbcRh0Wpud6Hl9KaUXFJzyX3S1pvoA0dHJ2BzjMI0zz8WIqn/exec';
const MAKS_POENG = 391;

const PALETTE = [
  '#378ADD','#1D9E75','#D85A30','#7F77DD','#BA7517',
  '#D4537E','#639922','#888780','#185FA5','#0F6E56',
  '#C44B9A','#3DAE9E','#E07B39','#6152A3','#4E8C2F',
];
const MEDALS = ['🥇','🥈','🥉'];

const fargeMap = {};
function farge(navn) {
  if (!fargeMap[navn]) {
    fargeMap[navn] = PALETTE[Object.keys(fargeMap).length % PALETTE.length];
  }
  return fargeMap[navn];
}

// ─── HENT DATA ─────────────────────────────────────────────────────
async function hentData() {
  if (WEBAPP_URL === 'DIN_WEBAPP_URL_HER') return demoData();
  try {
    const res = await fetch(WEBAPP_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) {
    console.error('Feil:', e);
    return null;
  }
}

function demoData() {
  const start = new Date('2026-06-11');
  const today = new Date();
  const days  = Math.min(Math.round((today - start) / 86400000), 38);
  const deltakere = ['Rune','Kari','Lars','Ingrid','Per','Jonas','Marte','Erik','Sofie','Ole','Linn','Thomas','Anna','Petter','Ida','Henrik','Camilla','Bjørn'];
  const seeds = [7,3,11,5,9,13,2,17,6,4,8,15,10,12,1,19,16,14];
  const datoer = [], kumulativt = {}, kategorier = {};
  deltakere.forEach(d => { kumulativt[d] = []; kategorier[d] = []; });

  for (let i = 0; i <= days; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    datoer.push(d.toISOString().slice(0,10));
    deltakere.forEach((navn, ni) => {
      const prev  = i === 0 ? 0 : kumulativt[navn][i-1];
      const add   = i === 0 ? 0 : Math.floor(Math.abs(Math.sin(i * seeds[ni]) * 6));
      kumulativt[navn].push(prev + add);
      const k = Math.floor(add * 0.6), t = Math.floor(add * 0.2),
            s = Math.floor(add * 0.1), b = add - k - t - s;
      kategorier[navn].push({ kamper: k, tabell: t, sluttspill: s, bonus: b });
    });
  }

  const rangering = deltakere
    .map(navn => {
      const siste = kategorier[navn].at(-1) || {};
      return { navn, poeng: kumulativt[navn].at(-1) || 0, ...siste };
    })
    .sort((a,b) => b.poeng - a.poeng);

  return { oppdatert: new Date().toISOString(), startDato: '2026-06-11',
           datoer, deltakere, kumulativt, kategorier, rangering, _demo: true };
}

function fmtTidspunkt(ts) {
  // Viser kun dato på aksen, men beholder tidspunkt som x-verdi for korrekt plassering
  const dato = ts.trim().slice(0, 10);
  const [y,m,d] = dato.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('no-NO', { day:'numeric', month:'short' });
}

// Konverter tidspunkt-streng til numerisk verdi for x-aksen (minutter siden epoch)
function tsToMinutter(ts) {
  const deler = ts.trim().split(' ');
  const [y,m,d] = deler[0].split('-').map(Number);
  const [t, min] = deler.length > 1 ? deler[1].split(':').map(Number) : [0, 0];
  return new Date(y, m-1, d, t, min).getTime();
}

// ─── KORT ──────────────────────────────────────────────────────────
function sistKategori(navn, data) {
  const kats = data.kategorier && data.kategorier[navn];
  if (!kats) return { kamper: 0, tabell: 0, sluttspill: 0, bonus: 0 };
  for (let i = kats.length - 1; i >= 0; i--) {
    const k = kats[i];
    if (k && (k.kamper > 0 || k.tabell > 0 || k.sluttspill > 0 || k.bonus > 0)) return k;
  }
  return { kamper: 0, tabell: 0, sluttspill: 0, bonus: 0 };
}

function byggKort(rangering, data) {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  rangering.forEach((r, i) => {
    const pst      = Math.round(r.poeng / MAKS_POENG * 100);
    const kat      = sistKategori(r.navn, data);
    const kamper   = kat.kamper     ?? 0;
    const tabell   = kat.tabell     ?? 0;
    const slutt    = kat.sluttspill ?? 0;
    const bonus    = kat.bonus      ?? 0;
    const f        = farge(r.navn);

    // Bygg tooltip-rader – vis kun kategorier med poeng
    const katRader = [
      { label: '⚽ Kampresultater', val: kamper },
      { label: '📊 Tabellplasseringer', val: tabell },
      { label: '🏆 Sluttspill', val: slutt },
      { label: '❓ Bonus', val: bonus },
    ]
    .filter(k => k.val > 0)
    .map(k => `<div class="card-tooltip-row">
        <span>${k.label}</span>
        <span class="card-tooltip-val">${k.val}p</span>
      </div>`)
    .join('');

    const ingenPoeng = katRader === ''
      ? '<div class="card-tooltip-row" style="color:var(--text3)"><span>Ingen poeng ennå</span></div>'
      : '';

    const c = document.createElement('div');
    c.className = 'card';
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => åpneModal(r.navn));
    c.innerHTML = `
      ${i < 3 ? `<span class="medal">${MEDALS[i]}</span>` : `<div class="card-rank">${i+1}.</div>`}
      <div class="card-name">${r.navn}</div>
      <div class="card-pts">${r.poeng}<span>p</span></div>
      <div class="card-max">${pst}% av maks</div>
      <div class="card-bar">
        <div class="card-bar-fill" style="width:${pst}%;background:${f}"></div>
      </div>
      <div class="card-cats">
        <span class="cat-badge">⚽ ${kamper}p</span>
        <span class="cat-badge">📊 ${tabell}p</span>
        <span class="cat-badge">🏆 ${slutt}p</span>
        ${bonus > 0 ? `<span class="cat-badge">❓ ${bonus}p</span>` : ''}
      </div>
      <div class="card-tooltip">
        <div class="card-tooltip-title">
          <div class="card-tooltip-dot" style="background:${f}"></div>
          ${r.navn}
        </div>
        ${katRader}
        ${ingenPoeng}
        <div class="card-tooltip-row">
          <span>Totalt</span>
          <span class="card-tooltip-val">${r.poeng}p av ${MAKS_POENG}p</span>
        </div>
      </div>`;
    // Skjul kort utover topp 7
    if (i >= 7) c.classList.add('card-skjult');
    container.appendChild(c);
  });

  // Legg til ekspander-knapp hvis mer enn 7 deltakere
  if (rangering.length > 7) {
    const btn = document.createElement('button');
    btn.className = 'ekspander-btn';
    btn.id = 'ekspander-btn';
    const skjulte = rangering.length - 7;
    btn.textContent = `Vis alle ${rangering.length} deltakere ↓`;
    btn.addEventListener('click', () => {
      const ekspandert = container.classList.toggle('ekspandert');
      btn.textContent = ekspandert
        ? 'Vis færre ↑'
        : `Vis alle ${rangering.length} deltakere ↓`;
    });
    container.appendChild(btn);
  }
}

// ─── GRAF ──────────────────────────────────────────────────────────
let chart = null;
const muted = new Set();

function byggGraf(data) {
  const labels   = data.datoer.map(fmtTidspunkt);

  const datasets = data.deltakere.map(navn => ({
    label:                     navn,
    data:                      data.kumulativt[navn],
    borderColor:               farge(navn),
    backgroundColor:           farge(navn),
    borderWidth:               2,
    pointRadius:               0,
    pointHoverRadius:          6,
    pointHoverBackgroundColor: farge(navn),
    pointHoverBorderColor:     '#fff',
    pointHoverBorderWidth:     2,
    tension:                   0,
    fill:                      false,
  }));

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          ticks: {
            color: '#888780',
            font:  { size: 11 },
            maxTicksLimit: 14,
            maxRotation: 35,
            callback: function(val, idx) {
              // Vis kun dato (ikke klokkeslett) på x-aksen
              // Skjul duplikate datoer
              const label = labels[idx];
              if (idx === 0) return label;
              const forrige = labels[idx - 1];
              const datoNaa    = label.split(' ')[0];
              const datoForrige = forrige ? forrige.split(' ')[0] : '';
              return datoNaa !== datoForrige ? label.split(' ')[0] : '';
            }
          },
          grid: { color: 'rgba(136,135,128,.10)' },
        },
        y: {
          beginAtZero: false,
          ticks: { color:'#888780', font:{ size:11 } },
          grid:  { color:'rgba(136,135,128,.10)' },
          title: { display: true, text: 'Poeng', color:'#888780', font:{ size:11 } },
        },
      },
    },
    plugins: [{
      id: 'crosshair',
      afterDraw(c) {
        if (c._hx == null) return;
        const { ctx, chartArea: { top, bottom } } = c;
        ctx.save();
        ctx.beginPath(); ctx.moveTo(c._hx, top); ctx.lineTo(c._hx, bottom);
        ctx.strokeStyle = 'rgba(136,135,128,.3)'; ctx.lineWidth = 1;
        ctx.setLineDash([4,3]); ctx.stroke(); ctx.restore();
      },
    }],
  });

  // ─── MOUSEOVER med detaljert tooltip ───────────────────────────
  const canvas  = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');

  canvas.addEventListener('mousemove', evt => {
    const pts = chart.getElementsAtEventForMode(evt, 'index', { intersect: false }, false);
    if (!pts.length) {
      tooltip.classList.remove('visible'); chart._hx = null; chart.update('none'); return;
    }

    const idx    = pts[0].index;
    chart._hx    = pts[0].element.x;
    chart.update('none');

    // Vis dato + klokkeslett i tooltip hvis ikke midnatt
    const rawTs = data.datoer[idx] || '';
    const deler = rawTs.split(' ');
    const datoStr = fmtTidspunkt(rawTs);
    const ttLabel = (deler[1] && deler[1] !== '00:00')
      ? datoStr + ' kl. ' + deler[1]
      : datoStr;
    document.getElementById('tt-date').textContent = ttLabel;

    // Sorter etter poeng på denne datoen
    const sorted = data.deltakere
      .map(navn => {
        const pts     = data.kumulativt[navn];
        const poeng   = (pts && pts[idx]) || 0;
        const forrige = idx > 0 ? ((pts && pts[idx-1]) || 0) : 0;
        const kat     = (data.kategorier && data.kategorier[navn]) ? data.kategorier[navn][idx] : null;
        return { navn, poeng, delta: poeng - forrige, kat, farge: farge(navn) };
      })
      .sort((a,b) => b.poeng - a.poeng);

    document.getElementById('tt-rows').innerHTML = sorted.map((d, rank) => {
      // Kategoribadges – vis kun hvis vi har data og minst én er > 0
      let katHTML = '';
      if (d.kat) {
        const cats = [
          { label: '⚽ kamper', val: d.kat.kamper },
          { label: '📊 tabell', val: d.kat.tabell },
          { label: '🏆 sluttspill', val: d.kat.sluttspill },
          { label: '❓ bonus', val: d.kat.bonus },
        ].filter(c => c.val > 0);

        if (cats.length > 0) {
          katHTML = `<div class="tt-cats">
            ${cats.map(c => `<span class="tt-cat">${c.label}: <span>${c.val}p</span></span>`).join('')}
          </div>`;
        }
      }

      return `<div class="tt-row">
        <div class="tt-left">
          <div class="tt-dot" style="background:${d.farge}"></div>
          <div class="tt-info">
            <div class="tt-name">${rank+1}. ${d.navn}</div>
            ${katHTML}
          </div>
        </div>
        <div class="tt-right">
          <div class="tt-pts">${d.poeng}p</div>
          ${d.delta > 0 ? `<div class="tt-delta">+${d.delta} i dag</div>` : ''}
        </div>
      </div>`;
    }).join('');

    tooltip.classList.add('visible');

    if (!tooltip._fryst) {
      const ttW = tooltip.offsetWidth  || 220;
      const ttH = tooltip.offsetHeight || 180;
      const pad = 14;
      let left  = evt.clientX + pad;
      let top   = evt.clientY - ttH / 2;
      if (left + ttW > window.innerWidth  - pad) left = evt.clientX - ttW - pad;
      if (top < 8)                               top  = 8;
      if (top + ttH > window.innerHeight  - 8)  top  = window.innerHeight - ttH - 8;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
    }
  });

  canvas.addEventListener('mouseleave', () => {
    if (!tooltip._fryst && !tooltip.matches(':hover')) {
      tooltip.classList.remove('visible');
      chart._hx = null;
      chart.update('none');
    }
  });

  tooltip.addEventListener('mouseleave', () => {
    if (!tooltip._fryst) {
      tooltip.classList.remove('visible');
      chart._hx = null;
      chart.update('none');
    }
  });

  // Klikk på datapunkt i grafen = frys/opphev tooltip
  canvas.addEventListener('click', (evt) => {
    const pts = chart.getElementsAtEventForMode(evt, 'index', { intersect: false }, false);
    if (!pts.length) return;

    if (tooltip._fryst) {
      tooltip._fryst = false;
      tooltip.style.outline = 'none';
    } else if (tooltip.classList.contains('visible')) {
      tooltip._fryst = true;
      tooltip.style.outline = '1.5px solid var(--border2)';
    }
  });

  // Klikk utenfor grafen og tooltip = opphev frys
  document.addEventListener('click', (evt) => {
    if (!canvas.contains(evt.target) && !tooltip.contains(evt.target)) {
      tooltip._fryst = false;
      tooltip.style.outline = 'none';
      tooltip.classList.remove('visible');
      chart._hx = null;
      chart.update('none');
    }
  });

  // Legende
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  data.deltakere.forEach((navn, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${farge(navn)}"></div>${navn}`;
    item.addEventListener('click', () => {
      if (muted.has(i)) { muted.delete(i); item.classList.remove('muted'); chart.show(i); }
      else              { muted.add(i);    item.classList.add('muted');    chart.hide(i); }
    });
    legend.appendChild(item);
  });
}

// ─── INIT ──────────────────────────────────────────────────────────
(async () => {
  const data = await hentData();
  if (!data || data.error) {
    document.getElementById('subtitle').textContent = '';
    document.getElementById('cards').innerHTML =
      `<p style="color:#c0392b;padding:20px">Kunne ikke laste data: ${data?.error || 'Ukjent feil'}. Sjekk WEBAPP_URL og at web app er redeployet.</p>`;
    return;
  }

  if (!data.deltakere || data.deltakere.length === 0) {
    document.getElementById('subtitle').textContent = 'Ingen data ennå – kjør oppdaterLeaderboard i Apps Script.';
    return;
  }

  // Pre-tildel farger i rangert rekkefølge
  data.rangering.forEach(r => farge(r.navn));

  byggKort(data.rangering, data);
  byggGraf(data);

  const oppdatert = new Date(data.oppdatert).toLocaleString('no-NO', {
    day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
  });
  document.getElementById('subtitle').textContent =
    (data._demo ? 'Demo-data – ' : '') + 'Oppdateres automatisk hvert 30. minutt';
  document.getElementById('updated').textContent = 'Sist oppdatert: ' + oppdatert;

  setTimeout(() => location.reload(), 5 * 60 * 1000);
})();

function åpneModal(navn) {
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalNavn').textContent = navn;
  document.getElementById('modalDot').style.background = farge(navn);
  document.getElementById('modalBody').innerHTML = '<div class="modal-loading">Laster rapport…</div>';
  overlay.classList.add('open');

  // Demo-modus: vis eksempeldata
  if (WEBAPP_URL === 'DIN_WEBAPP_URL_HER') {
    setTimeout(() => visDetaljIModal(demoDetalj(navn)), 400);
    return;
  }

  fetch(WEBAPP_URL + '?action=detalj&deltaker=' + encodeURIComponent(navn) + '&t=' + Date.now())
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      if (data.error) throw new Error(data.error);
      visDetaljIModal(data);
    })
    .catch(err => {
      document.getElementById('modalBody').innerHTML =
        `<div class="modal-loading" style="color:#c0392b">Feil: ${err.message}</div>`;
    });
}

function visDetaljIModal(data) {
  const body = document.getElementById('modalBody');
  let html = '';

  // Seksjoner i fast rekkefølge
  const seksjoner = [
    {
      id:    'kampresultater',
      ikon:  '⚽',
      tittel: 'Kampresultater',
      kater: ['Gruppespill – resultat'],
      visRunde: false,
    },
    {
      id:    'tabell',
      ikon:  '📊',
      tittel: 'Tabellplasseringer',
      kater: ['Gruppespill – plassering'],
      visRunde: false,
    },
    {
      id:    'sluttspill',
      ikon:  '🏆',
      tittel: 'Sluttspill',
      kater: [
        'Sluttspill – 8-delsfinale',
        'Sluttspill – Kvartfinale',
        'Sluttspill – Semifinale',
        'Sluttspill – Finale',
      ],
      rundeLabel: {
        'Sluttspill – 8-delsfinale': '8-delsfinale',
        'Sluttspill – Kvartfinale':  'Kvartfinale',
        'Sluttspill – Semifinale':   'Semifinale',
        'Sluttspill – Finale':       'Finale',
      },
      visRunde: true,
    },
    {
      id:    'mester',
      ikon:  '👑',
      tittel: 'VM-vinner',
      kater: ['Sluttspill – Mester'],
      visRunde: false,
    },
    {
      id:    'bonus',
      ikon:  '❓',
      tittel: 'Bonusspørsmål',
      kater: ['Bonus'],
      visRunde: false,
    },
  ];

  seksjoner.forEach(seksjon => {
    // Samle alle rader for denne seksjonen
    const alleRader = [];
    let totalSum = 0;

    seksjon.kater.forEach(kat => {
      const rader = data.grupper && data.grupper[kat];
      if (!rader || rader.length === 0) return;
      totalSum += data.summer && data.summer[kat] ? data.summer[kat] : 0;
      rader.forEach(r => alleRader.push({
        ...r,
        runde: seksjon.visRunde ? (seksjon.rundeLabel[kat] || '') : '',
      }));
    });

    if (alleRader.length === 0) return;

    html += `<div class="modal-section">
      <div class="modal-section-title">
        ${seksjon.ikon} ${seksjon.tittel}
        <span class="modal-section-sum">${totalSum}p</span>
      </div>`;

    alleRader.forEach(r => {
      if (r.poeng === 0 && !r.riktig) return;
      const fargeklasse = r.poeng > 0 ? 'grønn' : 'graa';
      const fasitStr    = r.fasit && r.fasit !== r.tips ? ` → ${r.fasit}` : '';
      const rundeStr    = r.runde ? `${r.runde} · ` : '';
      const merknadStr  = r.merknad ? `<div class="modal-row-merknad">${r.merknad}</div>` : '';

      html += `<div class="modal-row">
        <div class="modal-row-left">
          <div class="modal-row-kamp">${r.kamp}</div>
          <div class="modal-row-merknad">${rundeStr}${r.tips}${fasitStr}</div>
          ${merknadStr}
        </div>
        <div class="modal-row-right">
          <div class="modal-row-poeng ${fargeklasse}">${r.poeng}p</div>
        </div>
      </div>`;
    });

    html += '</div>';
  });

  html += `<div class="modal-totalt">
    <span>Totalt</span>
    <span>${data.totalt}p av 391p</span>
  </div>`;

  body.innerHTML = html;
}
